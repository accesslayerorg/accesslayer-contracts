[workspace]
members = [
    "common",
    "test-utils",
    "creator-keys",
    "creator-keys-factory",
    "referral-contract",
    "lp-reward-contract",
    "key-staking-contract",
    "multisig-admin",
    "nonce-registry",
    "session-nonce",
    "launch-auction",
    "key-liquidity-depth",
    "seasonal-rewards",
    "auto-invest-registry",
    "key-analytics",
    "dividend-contract",
    "subscription-contract",
    "fee-discount-contract",
    "batch-trade-contract",
    "social-metadata-contract",
    "key-liquidity-depth",
    "treasury-diversification",
    "storage-cleanup",
    "key-health-score",
    "personhood-hook",
    "creator-penalty",
    "sponsored-transactions",
    "vote-escrow-contract",
    "safe-mode-contract",
    "holder-insurance-pool",
    "sealed-launch-auction",
]
resolver = "2"

[workspace.package]
edition = "2021"
license = "MIT"
publish = false

[workspace.dependencies]
soroban-sdk = "22.0.11"

[profile.release]
opt-level = "z"
overflow-checks = true
debug = 0
strip = "symbols"
debug-assertions = false
panic = "abort"
codegen-units = 1
lto = true

# Suppress PDB generation on Windows to prevent linker exhaustion (LNK1318)
# under disk-constrained environments. Setting debug = 0 disables the Program
# Database file that the MSVC linker writes alongside the test binary. It also
# keeps local test builds small on constrained environments.
[profile.dev]
debug = 0

[profile.test]
debug = 0
