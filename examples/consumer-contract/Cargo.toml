[package]
name = "consumer-contract"
version = "0.1.0"
edition = "2021"
publish = false
description = "Example integrator contract: gates a function on creator-key balance, reads the live buy quote and accepts key transfers through the receiver callback."

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
soroban-sdk = { workspace = true }
common = { path = "../../common" }

[dev-dependencies]
soroban-sdk = { workspace = true, features = ["testutils"] }
creator-keys = { path = "../../creator-keys" }
